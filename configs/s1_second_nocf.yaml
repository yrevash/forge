# Forge-S1, ablation: the second model WITHOUT the plan-order counterfactuals.
# configs/s1_second.yaml without the two _cf slices; nothing else differs.
name: s1-second-nocf
seed: 0

data:
  folder: data/s1/v1            # made by: uv run python -m forge.s1.prepare
  # train_long_v2: sessions of NEW long parts (plans of 7 to 13 items), none of them a part
  # of the long test (forge/freecad/long_train_parts.py --check, and the audit).
  train_slices: [train_v2, train_long_v2]
  train_shards: null
  train_max_steps: null
  # Never trained on; they pick best.pt (the highest mean "all steps" accuracy of the two
  # groups). No test slice is read during training.
  held_out_groups:
    held_out_short:
      shards: [train_v2/shard193.npz, train_v2/shard194.npz, train_v2/shard195.npz]
      steps: 20000
    held_out_long:
      shards: [train_long_v2/shard053.npz, train_long_v2/shard054.npz, train_long_v2/shard055.npz]
      steps: 20000
  monitor_slice: null

model:                          # forge/s1/model.py; 2,166,241 parameters, as the first model
  width: 160
  layers: 6
  heads: 4
  mlp_width: 640
  dropout: 0.0

train:                          # exactly configs/s1_first.yaml, but for random_ids (see there)
  batch_size: 512
  passes: 3.0
  max_steps: null
  lr: 1.0e-3
  min_lr: 0.0
  warmup_steps: 500
  weight_decay: 0.01
  grad_clip: 1.0
  random_ids: true              # the repaired draw
  mixed_precision: true

log_every: 100
eval_every: 2000
checkpoint_minutes: 10
